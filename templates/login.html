<!DOCTYPE html>
<html lang="latam">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mundial 2026 - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-11 col-sm-8 col-md-6 col-lg-4">

            <div class="card login-card border-0">

                <div class="card-body p-4">

                    <h1 class="brand text-center mb-1">
                        MUNDIAL <span>2026</span>
                    </h1>

                    <p class="text-center text-light-emphasis mb-4">
                        Acceso al portal oficial
                    </p>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category in ['error', 'danger'] else category }} py-2">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('user.login_user_route') }}">

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control custom-input"
                                placeholder="tu@correo.com"
                                value="{{ request.form.email or '' }}"
                                required
                                autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control custom-input"
                                placeholder="••••••••"
                                required>
                        </div>

                        <div class="d-flex justify-content-between mb-4">

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="remember"
                                    {% if request.form.get('remember') %}checked{% endif %}>
                                <label class="form-check-label text-light">
                                    Recordarme
                                </label>
                            </div>

                            <a href="{{ url_for("user.reset_password_hud") }}" class="link-mundial">
                                ¿Olvidaste tu contraseña?
                            </a>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-mundial w-100 mb-3">
                            INICIAR SESIÓN
                        </button>
                    <p class="text-center mt-4 text-light">
                        ¿No tenés cuenta?
                        <a href="{{ url_for('user.register_user') }}" class="link-mundial">
                            Registrate
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
