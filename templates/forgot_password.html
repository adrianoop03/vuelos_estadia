<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-11 col-sm-8 col-md-6 col-lg-4">

            <div class="card login-card border-0">

                <div class="card-body p-4">

                    <h1 class="brand text-center mb-3">
                        RECUPERAR <span>CONTRASEÑA</span>
                    </h1>

                    <p class="text-center text-light-emphasis mb-4">
                        Ingresa tu correo electrónico
                    </p>

                    <form method="POST" action="{{ url_for('user.reset_password') }}">

                        <div class="mb-4">
                            <label class="form-label text-light">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control custom-input"
                                placeholder="tu@correo.com"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-mundial w-100">
                            ENVIAR ENLACE
                        </button>

                    </form>

                    <p class="text-center mt-4">
                        <a href="{{ url_for('user.login_page') }}" class="link-mundial">
                            Volver al inicio de sesión
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
