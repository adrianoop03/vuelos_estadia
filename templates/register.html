<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mundial 2026 - Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-11 col-sm-8 col-md-6 col-lg-4">

            <div class="card login-card border-0">

                <div class="card-body p-4">

                    <h1 class="brand text-center mb-1">
                        MUNDIAL <span>2026</span>
                    </h1>

                    <p class="text-center text-light-emphasis mb-4">
                        Crear una cuenta
                    </p>
                    {% if messages %}
                        <div class="alert alert-success d-flex align-items-start gap-3 shadow-sm border-0 mb-4">
                        {{ message }}
                    {% endif %}
                    {% if error %}
                        <div class="alert alert-danger py-2">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('user.register_user') }}">

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Nombre completo
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control custom-input"
                                placeholder="Ingresa tu nombre"
                                value="{{ request.form.name or '' }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control custom-input"
                                placeholder="tu@correo.com"
                                value="{{ request.form.email or '' }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control custom-input"
                                placeholder="••••••••"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light">
                                Confirmar contraseña
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control custom-input"
                                placeholder="••••••••"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-mundial w-100 mb-3">
                            REGISTRARSE
                        </button>

                    </form>

                    <p class="text-center mt-4 text-light">
                        ¿Ya tenés una cuenta?

                        <a href="{{ url_for('user.login_page') }}"
                           class="link-mundial">
                            Iniciar sesión
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
