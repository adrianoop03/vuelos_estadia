<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador Mundial 2026</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/users.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            Admin Mundial 2026
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarAdmin">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <button class="nav-link btn btn-link text-white"
                            onclick="mostrarSeccion('vuelos')">
                        Vuelos
                    </button>
                </li>

                <li class="nav-item">
                    <button class="nav-link btn btn-link text-white"
                            onclick="mostrarSeccion('alojamientos')">
                        Alojamientos
                    </button>
                </li>

            </ul>

            
            <span class="text-white me-3 d-none d-lg-inline">
                Hola, {{ current_user.name }}
            </span>

            <a href="/logout" class="btn btn-outline-light">
                Cerrar Sesión
            </a>

        </div>

    </div>
</nav>

<div class="container py-5">

    <div id="mensaje"
         class="alert alert-success d-none mb-4">
        Datos actualizados correctamente
    </div>

    <div id="mensajeError"
         class="alert alert-danger d-none mb-4">
    </div>

    <!-- VUELOS -->

    <div id="vuelos">

        <div class="card glass-card mb-4">

            <div class="card-body">

                <h2 class="mb-4" id="tituloFormVuelo">
                    Gestión de Vuelos
                </h2>

                {# TODO: ajustá API_VUELOS (definida en el <script> al final) a la URL real de tu endpoint REST #}
                <form id="formVuelo" onsubmit="guardarVuelo(event)">

                    <input type="hidden" id="vueloEditId" value="">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Número de Vuelo</label>
                            <input type="text"
                                   name="flight_number"
                                   class="form-control"
                                   placeholder="AR2026"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Selección</label>
                            {# 'teams' viene de wc26_data.cargar_selecciones() (o de tu modelo Team si ya lo armaste con ese mismo campo 'seleccion') #}
                            <select name="id_team" class="form-select" required>
                                <option value="" disabled selected>Elegí una selección</option>
                                {% for team in teams %}
                                <option value="{{ team.id_team }}">{{ team.seleccion }}</option>
                                {% endfor %}
                            </select>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Ciudad Origen</label>
                            <input type="text"
                                   name="origin_city"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Ciudad Destino</label>
                            <input type="text"
                                   name="destination_city"
                                   class="form-control"
                                   required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Fecha/Hora Salida</label>
                            <input type="datetime-local"
                                   name="departure_datetime"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Fecha/Hora Llegada</label>
                            <input type="datetime-local"
                                   name="arrival_datetime"
                                   class="form-control"
                                   required>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        Guardar Vuelo
                    </button>

                    <button type="button" class="btn btn-outline-light" onclick="resetFormVuelo()">
                        Cancelar edición
                    </button>

                </form>

            </div>

        </div>

        <div class="card glass-card">

            <div class="card-body">

                <h4 class="mb-3">Vuelos registrados</h4>

                <div class="table-responsive">
                    <table class="table table-hover text-white align-middle">
                        <thead>
                            <tr>
                                <th>Vuelo</th>
                                <th>Selección</th>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Salida</th>
                                <th>Llegada</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for vuelo in vuelos %}
                            <tr data-id="{{ vuelo.id_flight }}"
                                data-flight-number="{{ vuelo.flight_number }}"
                                data-team="{{ vuelo.id_team }}"
                                data-origin="{{ vuelo.origin_city }}"
                                data-destination="{{ vuelo.destination_city }}"
                                data-departure="{{ vuelo.departure_datetime.strftime('%Y-%m-%dT%H:%M') }}"
                                data-arrival="{{ vuelo.arrival_datetime.strftime('%Y-%m-%dT%H:%M') }}">
                                <td>{{ vuelo.flight_number }}</td>
                                <td>{{ vuelo.team.seleccion if vuelo.team else vuelo.id_team }}</td>
                                <td>{{ vuelo.origin_city }}</td>
                                <td>{{ vuelo.destination_city }}</td>
                                <td>{{ vuelo.departure_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                                <td>{{ vuelo.arrival_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-light" onclick="editarVuelo(this)">Editar</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarVuelo(this)">Eliminar</button>
                                </td>
                            </tr>
                            {% else %}
                            <tr><td colspan="7" class="text-center text-white-50">No hay vuelos registrados todavía.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

            </div>

        </div>

    </div>

    <!-- ALOJAMIENTOS -->

    <div id="alojamientos" style="display:none;">

        <div class="card glass-card mb-4">

            <div class="card-body">

                <h2 class="mb-4">
                    Gestión de Alojamientos
                </h2>

                {# TODO: ajustá API_ALOJAMIENTOS (definida en el <script> al final) a la URL real de tu endpoint REST #}
                <form id="formAlojamiento" onsubmit="guardarAlojamiento(event)">

                    <input type="hidden" id="alojamientoEditId" value="">

                    <div class="mb-3">
                        <label>Nombre del alojamiento</label>
                        <input type="text"
                               name="nombre_alojamiento"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>País</label>
                        <input type="text"
                               name="pais"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Estado</label>
                        <input type="text"
                               name="estado"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Ciudad</label>
                        <input type="text"
                               name="ciudad"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit" class="btn btn-success">
                        Guardar Alojamiento
                    </button>

                    <button type="button" class="btn btn-outline-light" onclick="resetFormAlojamiento()">
                        Cancelar edición
                    </button>

                </form>

            </div>

        </div>

        <div class="card glass-card">

            <div class="card-body">

                <h4 class="mb-3">Alojamientos registrados</h4>

                <div class="table-responsive">
                    <table class="table table-hover text-white align-middle">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>País</th>
                                <th>Estado</th>
                                <th>Ciudad</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for alojamiento in alojamientos %}
                            <tr data-id="{{ alojamiento.id_alojamiento }}"
                                data-nombre="{{ alojamiento.nombre_alojamiento }}"
                                data-pais="{{ alojamiento.pais }}"
                                data-estado="{{ alojamiento.estado }}"
                                data-ciudad="{{ alojamiento.ciudad }}">
                                <td>{{ alojamiento.nombre_alojamiento }}</td>
                                <td>{{ alojamiento.pais }}</td>
                                <td>{{ alojamiento.estado }}</td>
                                <td>{{ alojamiento.ciudad }}</td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-light" onclick="editarAlojamiento(this)">Editar</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarAlojamiento(this)">Eliminar</button>
                                </td>
                            </tr>
                            {% else %}
                            <tr><td colspan="5" class="text-center text-white-50">No hay alojamientos registrados todavía.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

// TODO: ajustá estas dos constantes a las rutas reales de tu API REST (ej: '/api/vuelos')
const API_VUELOS = '/vuelos';
const API_ALOJAMIENTOS = '/alojamientos';

function mostrarSeccion(seccion){
    document.getElementById("vuelos").style.display = "none";
    document.getElementById("alojamientos").style.display = "none";
    document.getElementById(seccion).style.display = "block";
}

function mostrarMensaje(texto){
    const mensaje = document.getElementById("mensaje");
    mensaje.textContent = texto;
    mensaje.classList.remove("d-none");
    setTimeout(() => mensaje.classList.add("d-none"), 2500);
}

function mostrarError(texto){
    const error = document.getElementById("mensajeError");
    error.textContent = texto;
    error.classList.remove("d-none");
    setTimeout(() => error.classList.add("d-none"), 4000);
}

// ---------- VUELOS ----------

async function guardarVuelo(event){
    event.preventDefault();

    const form = event.target;
    const id = document.getElementById("vueloEditId").value;

    const payload = {
        flight_number: form.flight_number.value,
        id_team: form.id_team.value,
        origin_city: form.origin_city.value,
        destination_city: form.destination_city.value,
        departure_datetime: form.departure_datetime.value,
        arrival_datetime: form.arrival_datetime.value
    };

    const url = id ? `${API_VUELOS}/${id}` : API_VUELOS;
    const method = id ? 'PUT' : 'POST';

    try {
        const resp = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (resp.ok) {
            mostrarMensaje(id ? 'Vuelo actualizado correctamente' : 'Vuelo creado correctamente');
            setTimeout(() => location.reload(), 600);
        } else {
            const data = await resp.json().catch(() => ({}));
            mostrarError(data.message || 'No se pudo guardar el vuelo');
        }
    } catch (err) {
        console.error(err);
        mostrarError('Error de conexión con el servidor');
    }
}

function editarVuelo(btn){
    const row = btn.closest('tr');
    const form = document.getElementById('formVuelo');

    document.getElementById('vueloEditId').value = row.dataset.id;
    form.flight_number.value = row.dataset.flightNumber;
    form.id_team.value = row.dataset.team;
    form.origin_city.value = row.dataset.origin;
    form.destination_city.value = row.dataset.destination;
    form.departure_datetime.value = row.dataset.departure;
    form.arrival_datetime.value = row.dataset.arrival;

    document.getElementById('tituloFormVuelo').textContent = `Editando vuelo ${row.dataset.flightNumber}`;
    mostrarSeccion('vuelos');
    form.scrollIntoView({ behavior: 'smooth' });
}

function resetFormVuelo(){
    const form = document.getElementById('formVuelo');
    form.reset();
    document.getElementById('vueloEditId').value = '';
    document.getElementById('tituloFormVuelo').textContent = 'Gestión de Vuelos';
}

async function eliminarVuelo(btn){
    const row = btn.closest('tr');
    const id = row.dataset.id;

    if (!confirm('¿Eliminar este vuelo?')) return;

    try {
        const resp = await fetch(`${API_VUELOS}/${id}`, { method: 'DELETE' });
        if (resp.ok) {
            row.remove();
            mostrarMensaje('Vuelo eliminado');
        } else {
            mostrarError('No se pudo eliminar el vuelo');
        }
    } catch (err) {
        console.error(err);
        mostrarError('Error de conexión con el servidor');
    }
}

// ---------- ALOJAMIENTOS ----------

async function guardarAlojamiento(event){
    event.preventDefault();

    const form = event.target;
    const id = document.getElementById("alojamientoEditId").value;

    const payload = {
        nombre_alojamiento: form.nombre_alojamiento.value,
        pais: form.pais.value,
        estado: form.estado.value,
        ciudad: form.ciudad.value
    };

    const url = id ? `${API_ALOJAMIENTOS}/${id}` : API_ALOJAMIENTOS;
    const method = id ? 'PUT' : 'POST';

    try {
        const resp = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (resp.ok) {
            mostrarMensaje(id ? 'Alojamiento actualizado correctamente' : 'Alojamiento creado correctamente');
            setTimeout(() => location.reload(), 600);
        } else {
            const data = await resp.json().catch(() => ({}));
            mostrarError(data.message || 'No se pudo guardar el alojamiento');
        }
    } catch (err) {
        console.error(err);
        mostrarError('Error de conexión con el servidor');
    }
}

function editarAlojamiento(btn){
    const row = btn.closest('tr');
    const form = document.getElementById('formAlojamiento');

    document.getElementById('alojamientoEditId').value = row.dataset.id;
    form.nombre_alojamiento.value = row.dataset.nombre;
    form.pais.value = row.dataset.pais;
    form.estado.value = row.dataset.estado;
    form.ciudad.value = row.dataset.ciudad;

    mostrarSeccion('alojamientos');
    form.scrollIntoView({ behavior: 'smooth' });
}

function resetFormAlojamiento(){
    const form = document.getElementById('formAlojamiento');
    form.reset();
    document.getElementById('alojamientoEditId').value = '';
}

async function eliminarAlojamiento(btn){
    const row = btn.closest('tr');
    const id = row.dataset.id;

    if (!confirm('¿Eliminar este alojamiento?')) return;

    try {
        const resp = await fetch(`${API_ALOJAMIENTOS}/${id}`, { method: 'DELETE' });
        if (resp.ok) {
            row.remove();
            mostrarMensaje('Alojamiento eliminado');
        } else {
            mostrarError('No se pudo eliminar el alojamiento');
        }
    } catch (err) {
        console.error(err);
        mostrarError('Error de conexión con el servidor');
    }
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
